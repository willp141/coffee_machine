<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Coffee Machine UI</title>
	<style>
		body {
			font-family: monospace;
			background-color: #111;
			color: #eee;
			text-align: center;
			padding: 30px;
		}
		h1 {
			color: #ffcc00;
		}
		button {
			font-size: 1.2em;
			padding: 12px 20px;
			margin: 10px;
			border: none;
			border-radius: 5px;
			cursor: pointer;
		}
		.heat { background-color: #e67e22; color: white; }
		.pump { background-color: #e74c3c; color: white; }
		.steam { background-color: #9b59b6; color: white; }
		.cancel { background-color: #555; color: white; }
		.admin { background-color: #2c3e50; color: white; }

		#status {
			margin-top: 20px;
			font-size: 1.1em;
			background: #222;
			padding: 15px;
			border-radius: 10px;
			display: inline-block;
		}
	</style>
</head>
<body>

	<h1>ESPRESS-O-MATIC 9000</h1>

	<div id="controls">
		<button class="heat" id="btn-heat" onclick="sendCommand('/heat')">HEAT UP BITCH</button>
		<button class="pump" id="btn-pump" onclick="sendCommand('/pump')">PUMP MUTHAFUCKAAA</button>
		<button class="steam" id="btn-steam" onclick="sendCommand('/steam')">LETS GET STEAMYYYYY</button>
		<button class="steam" id="btn-steam-done" onclick="sendCommand('/steam_done')">STEAM DONE</button>
		<button class="cancel" id="btn-cancel" onclick="sendCommand('/cancel')">CANCEL</button>
	</div>

	<hr style="margin: 30px 0;">

	<label>
		<input type="checkbox" id="admin-toggle" onchange="toggleAdmin()">
		Enable Admin Mode
	</label>

	<div id="admin-controls" style="display: none; margin-top: 20px;">
		<h2>Manual Controls (Admin)</h2>
		<button class="admin" onclick="sendCommand('/admin/pump_on')">Pump ON</button>
		<button class="admin" onclick="sendCommand('/admin/pump_off')">Pump OFF</button>
		<button class="admin" onclick="sendCommand('/admin/boiler_on')">Boiler ON</button>
		<button class="admin" onclick="sendCommand('/admin/boiler_off')">Boiler OFF</button>
		<br>
		<button class="cancel" onclick="exitAdmin()">Exit Admin Mode</button>
	</div>

	<div id="status">
		<p><strong>Temp:</strong> <span id="temp">--</span> °F</p>
		<p><strong>State:</strong> <span id="state">--</span></p>
	</div>

	<script>
		let currentState = "IDLE";
		let adminMode = false;

		async function sendCommand(path) {
			try {
				const res = await fetch(path);
				const text = await res.text();
				console.log("Command response:", text);
				await fetchStatus();
			} catch (e) {
				alert("Command failed");
			}
		}

		async function fetchStatus() {
			try {
				const res = await fetch('/status');
				const data = await res.json();
				document.getElementById('temp').textContent = data.temp.toFixed(1);
				document.getElementById('state').textContent = data.state;
				currentState = data.state;
				updateButtons();
			} catch (e) {
				document.getElementById('state').textContent = 'Disconnected';
			}
		}

		function updateButtons() {
			const btnHeat = document.getElementById('btn-heat');
			const btnPump = document.getElementById('btn-pump');
			const btnSteam = document.getElementById('btn-steam');
			const btnSteamDone = document.getElementById('btn-steam-done');
			const btnCancel = document.getElementById('btn-cancel');

			btnHeat.style.display = (currentState === 'IDLE') ? 'inline-block' : 'none';
			btnPump.style.display = (currentState === 'READY_COFFEE') ? 'inline-block' : 'none';
			btnSteam.style.display = (currentState === 'READY_COFFEE') ? 'inline-block' : 'none';
			btnSteamDone.style.display = (currentState === 'READY_STEAM') ? 'inline-block' : 'none';
			btnCancel.style.display = (currentState !== 'IDLE' && currentState !== 'ERROR') ? 'inline-block' : 'none';

			document.getElementById('admin-controls').style.display = adminMode ? 'block' : 'none';
		}

		function toggleAdmin() {
			adminMode = document.getElementById('admin-toggle').checked;
			updateButtons();
		}

		async function exitAdmin() {
			await sendCommand('/admin/override_off');
			document.getElementById('admin-toggle').checked = false;
			adminMode = false;
			updateButtons();
		}

		setInterval(fetchStatus, 2000);
		fetchStatus();
	</script>

</body>
</html>
