<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Coffee Test UI</title>
	<style>
		body {
			font-family: sans-serif;
			background-color: #111;
			color: #eee;
			text-align: center;
			padding: 30px;
		}
		button {
			font-size: 1.5em;
			padding: 15px 25px;
			margin: 20px;
			background-color: #e67e22;
			color: white;
			border: none;
			border-radius: 8px;
			cursor: pointer;
		}
	</style>
</head>
<body>

	<h1>🚀 Coffee Machine Test</h1>

	<button onclick="sendCommand('/heat')">🔥 HEAT UP BITCH</button>

	<pre id="log"></pre>

	<script>
		async function sendCommand(path) {
			console.log("Sending command to", path);
			log("Sending command to " + path);

			try {
				const res = await fetch(path);
				const text = await res.text();
				console.log("Response:", text);
				log("Response: " + text);
			} catch (e) {
				console.error("Error sending command", e);
				log("Error: " + e);
			}
		}

		function log(msg) {
			const logEl = document.getElementById("log");
			logEl.textContent += msg + "\n";
		}
	</script>

</body>
</html>
